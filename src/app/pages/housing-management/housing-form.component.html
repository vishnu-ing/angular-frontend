<!-- housing-form.component.html -->
<div class="housing-form">
  <div class="housing-form-header">
    <h2>Add New House</h2>
    <button
      type="button"
      class="back-btn"
      (click)="goToHousing()"
      style="margin-left: auto"
    >
      Back to Housing List
    </button>
  </div>

  <form #houseForm="ngForm" (ngSubmit)="submit()">
    <div class="form-field">
      <label for="address">Address:</label>
      <input
        id="address"
        name="address"
        type="text"
        [(ngModel)]="form.address"
        required
      />
    </div>

    <h3>Landlord Information</h3>

    <div class="form-field">
      <label for="landlordName">Full Name:</label>
      <input
        id="landlordName"
        name="landlordName"
        type="text"
        [(ngModel)]="form.landlord.fullName"
        required
      />
    </div>
    <div class="form-field">
      <label for="landlordPhone">Phone:</label>
      <input
        id="landlordPhone"
        name="landlordPhone"
        type="text"
        [(ngModel)]="form.landlord.phone"
        required
      />
    </div>
    <div class="form-field">
      <label for="landlordEmail">Email:</label>
      <input
        id="landlordEmail"
        name="landlordEmail"
        type="email"
        [(ngModel)]="form.landlord.email"
        required
        email
        #emailModel="ngModel"
      />
      <div
        class="error-message"
        *ngIf="emailModel.invalid && emailModel.touched"
      >
        Please enter a valid email address.
      </div>
    </div>

    <h3>Facility Information</h3>
    <div>
      <label>
        Beds:
        <input
          type="number"
          [(ngModel)]="form.facility.beds"
          name="beds"
          min="0"
          required
          (focus)="clearIfZero('beds')"
        />
      </label>
    </div>
    <div>
      <label>
        Mattresses:
        <input
          type="number"
          [(ngModel)]="form.facility.mattresses"
          name="mattresses"
          min="0"
          required
          (focus)="clearIfZero('mattresses')"
        />
      </label>
    </div>
    <div>
      <label>
        Tables:
        <input
          type="number"
          [(ngModel)]="form.facility.tables"
          name="tables"
          min="0"
          required
          (focus)="clearIfZero('tables')"
        />
      </label>
    </div>
    <div>
      <label>
        Chairs:
        <input
          type="number"
          [(ngModel)]="form.facility.chairs"
          name="chairs"
          min="0"
          required
          (focus)="clearIfZero('chairs')"
        />
      </label>
    </div>

    <button
      type="submit"
      [disabled]="submitting || !houseForm.valid"
      [ngClass]="{
        disabled: submitting || !houseForm.valid,
        ready: !submitting && houseForm.valid
      }"
      style="color: #fff"
    >
      {{ submitting ? "Saving..." : "Save House" }}
    </button>
    <style>
      button.ready {
        background: #28a745 !important;
        color: #fff !important;
        border: none;
      }
      button.disabled {
        background: #ccc !important;
        color: #333 !important;
        border: none;
      }
    </style>

    <div *ngIf="error" class="error">{{ error }}</div>
  </form>
</div>
