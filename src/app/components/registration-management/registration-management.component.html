<mat-card style="margin-bottom: 20px; padding: 20px;">
  <h2>Invite New Employee</h2>
  
  <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
    <mat-form-field appearance="fill">
      <mat-label>Candidate Name</mat-label>
      <input matInput [(ngModel)]="newName" placeholder="John Doe">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Candidate Email</mat-label>
      <input matInput [(ngModel)]="newEmail" placeholder="john@example.com">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onSendInvite()">
      Generate Token & Send Email
    </button>
  </div>

  <mat-divider></mat-divider>

  <h3 style="margin-top: 15px;">Invitation History</h3>
  
  <table mat-table [dataSource]="(tokenHistory$ | async) || []" class="mat-elevation-z8" style="width: 100%;">
    
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="link">
      <th mat-header-cell *matHeaderCellDef> Registration Link </th>
      <td mat-cell *matCellDef="let element"> 
        <a [href]="'http://localhost:5173/register?token=' + element.token" target="_blank">Link</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element"> {{element.status}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-card>
