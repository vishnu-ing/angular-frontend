<table mat-table [dataSource]="users || []" class="mat-elevation-z8">
  
  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let user"> {{user.firstName}} {{user.lastName}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let user"> {{user.email}} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Application </th>
    <td mat-cell *matCellDef="let user">
      <div class ="action-wrapper">
        <mat-form-field appearance="fill" class="small-input">
          <mat-label>Feedback</mat-label>
          <textarea matInput [(ngModel)]="feedbackValues[user.userName]"></textarea>
        </mat-form-field>
        
        <button mat-raised-button color="accent" (click)="onApprove(user)">Approve</button>
        <button mat-raised-button color="warn" (click)="onReject(user)">Reject</button>
        <button mat-button (click)="view.emit(user.userName)">View Application</button>
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="viewOnly">
    <th mat-header-cell *matHeaderCellDef> Application </th>
    <td mat-cell *matCellDef="let user">
       <button mat-button (click)="view.emit(user.userName)">View Application</button>
       </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div *ngIf="!users || users.length === 0" style="padding: 20px; text-align: center;">
  No {{status}} applications found.
</div>
